{
  "cluster": {
    "name": "nats",
    "no_advertise": true,
    "port": 6222,
    "routes": [
      "nats://nats1:6222",
      "nats://nats3:6222"
    ]
  },
  "http_port": 8222,
  "jetstream": {
    "max_file_store": 53687091200,
    "max_memory_store": 0,
    "store_dir": "/data"
  },
  "accounts": {
    "SYS": {
      "users": [
        {
          "user": "sys",
          "password": "sys-password"
        }
      ]
    },
    "APP": {
      "jetstream": "enabled",
      "users": [
        {
          "user": "app",
          "password": "app-password",
          "permissions": {
            "publish": {
              "allow": [
                "mongo-cdc",
                "mongo-cdc.>",
                "__debezium-heartbeat.>",
                "$JS.API.>",
                "$JS.ACK.>",
                "_INBOX.>"
              ]
            },
            "subscribe": {
              "allow": [
                "mongo-cdc",
                "mongo-cdc.>",
                "__debezium-heartbeat.>",
                "_INBOX.>"
              ]
            }
          }
        }
      ]
    }
  },
  "system_account": "SYS",
  "lame_duck_duration": "30s",
  "lame_duck_grace_period": "10s",
  "port": 4222,
  "server_name": "nats2"
}
