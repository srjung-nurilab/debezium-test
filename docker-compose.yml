services:
  mongo1:
    image: mongo:7.0.8
    container_name: mongo1
    hostname: mongo1
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
      - mongo1-config:/data/configdb
    networks:
      - cdc
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost:27017 --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo2:
    image: mongo:7.0.8
    container_name: mongo2
    hostname: mongo2
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
      - mongo2-config:/data/configdb
    networks:
      - cdc
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost:27017 --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo3:
    image: mongo:7.0.8
    container_name: mongo3
    hostname: mongo3
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
      - mongo3-config:/data/configdb
    networks:
      - cdc
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost:27017 --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7.0.8
    container_name: mongo-init
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ./scripts/mongo-init.js:/scripts/mongo-init.js:ro
    networks:
      - cdc
    entrypoint: ["mongosh", "--host", "mongo1:27017", "/scripts/mongo-init.js"]
    restart: "no"

  nats1:
    image: nats:2.14.2-alpine
    container_name: nats1
    hostname: nats1
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats1-data:/data
      - ./nats/nats1.conf:/etc/nats/nats.conf:ro
    networks:
      - cdc
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  nats2:
    image: nats:2.14.2-alpine
    container_name: nats2
    hostname: nats2
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats.conf"]
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - nats2-data:/data
      - ./nats/nats2.conf:/etc/nats/nats.conf:ro
    networks:
      - cdc
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  nats3:
    image: nats:2.14.2-alpine
    container_name: nats3
    hostname: nats3
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats.conf"]
    ports:
      - "4224:4222"
      - "8224:8222"
    volumes:
      - nats3-data:/data
      - ./nats/nats3.conf:/etc/nats/nats.conf:ro
    networks:
      - cdc
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  nats-box:
    image: natsio/nats-box:0.18.0
    container_name: nats-box
    depends_on:
      nats1:
        condition: service_healthy
      nats2:
        condition: service_healthy
      nats3:
        condition: service_healthy
    volumes:
      - ./nats/streams/mongo-cdc.json:/config/mongo-cdc.json:ro
    networks:
      - cdc
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep 3600; done"]
    restart: unless-stopped

  debezium:
    image: quay.io/debezium/server:3.6.0.Final
    container_name: debezium
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - debezium-offsets:/debezium/data
    networks:
      - cdc
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - cdc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  cdc:
    name: cdc

volumes:
  mongo1-data:
  mongo1-config:
  mongo2-data:
  mongo2-config:
  mongo3-data:
  mongo3-config:
  nats1-data:
  nats2-data:
  nats3-data:
  debezium-offsets:
  postgres-data:
