# NATS JetStream sink. The stream is created by nats-init to keep its
# retention and replication settings independent of the Debezium container.
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://app:app-password@nats1:4222,nats://app:app-password@nats2:4222,nats://app:app-password@nats3:4222
debezium.sink.nats-jetstream.stream-name=MONGO_CDC
debezium.sink.nats-jetstream.create-stream=false
debezium.sink.nats-jetstream.subjects=mongo-cdc,mongo-cdc.>,__debezium-heartbeat.>
debezium.sink.nats-jetstream.async.enabled=false

# Existing MongoDB documents are loaded by the bulk migrator. Debezium begins
# publishing only changes made after its MongoDB change stream is established.
debezium.source.connector.class=io.debezium.connector.mongodb.MongoDbConnector
debezium.source.mongodb.connection.string=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
debezium.source.topic.prefix=mongo-cdc
debezium.source.collection.include.list=app.orders,app.migration_markers
debezium.source.snapshot.mode=no_data
debezium.source.capture.mode=change_streams_update_full
debezium.source.capture.mode.full.update.type=lookup
debezium.source.heartbeat.interval.ms=1000

# Debezium Server is not backed by Kafka Connect, so persist connector offsets
# explicitly. Recreating the container does not replay the whole change stream.
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# Go CDC applier input: schema-less JSON Debezium envelopes.
debezium.format.key=json
debezium.format.value=json
debezium.format.value.schemas.enable=false
